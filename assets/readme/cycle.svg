<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">The twelve-hour cycle</title>
  <desc id="desc">Five stages: the Steward assigns minds, the Physicist or UI engineer proposes one change, the kernel branches the living world five times, the Judge rules, the Chronicler writes the journal. Beneath them, the frozen kernel and the sun.</desc>

  <rect width="1200" height="420" rx="24" fill="#e6ecef"/>

  <g id="stages" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" fill="#17232b">
    <!-- 1 Steward -->
    <g transform="translate(56 44)">
      <rect width="208" height="196" rx="4" fill="#f4f7f8" stroke="#b9c6cc"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5b6b74">01 · overseer</text>
      <text x="16" y="70" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="28">Steward</text>
      <text x="16" y="112" font-size="20">picks a mind for</text>
      <text x="16" y="138" font-size="20">each role and the</text>
      <text x="16" y="164" font-size="20">cycle's focus</text>
    </g>
    <!-- 2 Physicist / UI engineer -->
    <g transform="translate(276 44)">
      <rect width="208" height="196" rx="4" fill="#f4f7f8" stroke="#b9c6cc"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5b6b74">02 · overseer</text>
      <text x="16" y="70" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="28">Physicist</text>
      <text x="16" y="96" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="20" font-style="italic" fill="#5b6b74">or UI engineer</text>
      <text x="16" y="124" font-size="20">proposes one</text>
      <text x="16" y="150" font-size="20">change with a</text>
      <text x="16" y="176" font-size="20">hypothesis</text>
    </g>
    <!-- 3 Kernel branches -->
    <g transform="translate(496 44)">
      <rect width="208" height="196" rx="4" fill="#17232b"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#b9c6cc">03 · kernel</text>
      <text x="16" y="70" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="28" fill="#f4f7f8">Branch ×5</text>
      <text x="16" y="112" font-size="20" fill="#f4f7f8">runs the living</text>
      <text x="16" y="138" font-size="20" fill="#f4f7f8">world under the</text>
      <text x="16" y="164" font-size="20" fill="#f4f7f8">proposed laws</text>
    </g>
    <!-- 4 Judge -->
    <g transform="translate(716 44)">
      <rect width="208" height="196" rx="4" fill="#f4f7f8" stroke="#b9c6cc"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5b6b74">04 · overseer</text>
      <text x="16" y="70" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="28">Judge</text>
      <text x="16" y="96" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="20" font-style="italic" fill="#5b6b74">another model family</text>
      <text x="16" y="124" font-size="20">reads the diff and</text>
      <text x="16" y="150" font-size="20">metrics, merges</text>
      <text x="16" y="176" font-size="20">or rejects</text>
    </g>
    <!-- 5 Chronicler -->
    <g transform="translate(936 44)">
      <rect width="208" height="196" rx="4" fill="#f4f7f8" stroke="#b9c6cc"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5b6b74">05 · overseer</text>
      <text x="16" y="70" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="28">Chronicler</text>
      <text x="16" y="112" font-size="20">writes the lab</text>
      <text x="16" y="138" font-size="20">journal, also</text>
      <text x="16" y="164" font-size="20">shown on the site</text>
    </g>
    <!-- connectors -->
    <g stroke="#5b6b74" stroke-width="1.5" fill="none">
      <path d="M264 142 h12 m0 0 l-5 -4 m5 4 l-5 4"/>
      <path d="M484 142 h12 m0 0 l-5 -4 m5 4 l-5 4"/>
      <path d="M704 142 h12 m0 0 l-5 -4 m5 4 l-5 4"/>
      <path d="M924 142 h12 m0 0 l-5 -4 m5 4 l-5 4"/>
    </g>
  </g>

  <g id="foundation" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <line x1="56" y1="272" x2="1144" y2="272" stroke="#b9c6cc"/>
    <text x="56" y="306" fill="#17232b" font-weight="600">KERNEL · frozen</text>
    <text x="236" y="306" fill="#5b6b74">hash-checked every run · restores itself if touched · keeps a last-known-good tag</text>
    <text x="236" y="332" fill="#5b6b74">limits: build passes · survival ≥ 0.5 · score ≥ 70 % of baseline · +15 % lines · 1.5 MB</text>
    <text x="56" y="372" fill="#b87a1f" font-weight="600">SUN · the budget</text>
    <text x="236" y="372" fill="#5b6b74">monthly OpenRouter allowance · the only lever the human keeps</text>
    <text x="236" y="398" fill="#5b6b74">running low → cheaper minds · gone → hibernate</text>
  </g>
</svg>
