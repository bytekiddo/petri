<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">petri — one world, one tick per second</title>
  <desc id="desc">A self-evolving artificial-life world. A real frame of the 128 by 128 dish, rendered by the project's own engine, sits beside the title.</desc>
  <defs>
    <clipPath id="dish-clip"><circle cx="960" cy="200" r="150"/></clipPath>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f4f7f8"/>
      <stop offset="0.75" stop-color="#cfd9de"/>
      <stop offset="1" stop-color="#b7c3c8"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#e6ecef"/>

  <g id="title-block" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" fill="#17232b">
    <text x="64" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#5b6b74">ARTIFICIAL LIFE · A REPOSITORY THAT EVOLVES ITSELF</text>
    <text x="60" y="172" font-size="112" font-weight="400" letter-spacing="-1">petri</text>
    <text x="64" y="226" font-size="36" font-style="italic" fill="#5b6b74">one world, one tick per second</text>
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#17232b">
      <text x="64" y="272">One dish, running since genesis, never paused or restarted.</text>
      <text x="64" y="302">Every twelve hours, AI overseers rewrite one law of its physics.</text>
      <text x="64" y="332">The creatures alive at that moment carry on under the new law.</text>
    </g>
    <g id="tick-ruler" stroke="#b9c6cc" stroke-width="1.5">
      <line x1="64" y1="366" x2="424" y2="366"/>
      <line x1="64" y1="358" x2="64" y2="374" stroke="#17232b"/>
      <line x1="124" y1="361" x2="124" y2="371"/><line x1="184" y1="361" x2="184" y2="371"/><line x1="244" y1="361" x2="244" y2="371"/><line x1="304" y1="361" x2="304" y2="371"/><line x1="364" y1="361" x2="364" y2="371"/>
      <line x1="424" y1="358" x2="424" y2="374" stroke="#b87a1f"/>
    </g>
    <text x="440" y="373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5b6b74">1 tick = 1 real second</text>
  </g>

  <g id="project-proof">
    <ellipse cx="960" cy="356" rx="140" ry="14" fill="#17232b" opacity="0.10"/>
    <circle cx="960" cy="200" r="150" fill="url(#glass)"/>
    <image x="810" y="50" width="300" height="300" clip-path="url(#dish-clip)" opacity="0.92"
           style="image-rendering: pixelated; image-rendering: crisp-edges"
           xlink:href="data:image/png;base64,"/>
    <circle cx="960" cy="200" r="147" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>
    <circle cx="960" cy="200" r="150" fill="none" stroke="#b9c6cc" stroke-width="1"/>
    <text x="960" y="385" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5b6b74">eon 1 · tick 3600 · 501 alive · 19 species</text>
  </g>
</svg>
