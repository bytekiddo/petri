# KERNEL FILE. Every twelve hours the overseers may change one law. GITHUB_TOKEN cannot modify
# workflows, so this file is beyond their reach.
name: evolve
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: canon
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '10' }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          git config user.name "petri overseers"
          git config user.email "overseers@bytekiddo.com"
      - name: One evolutionary cycle
        run: npm run cycle
      - run: |
          git push --force-with-lease origin HEAD
          git push -f origin last-known-good
      - name: Build site from whatever survived
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
